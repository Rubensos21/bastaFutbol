packages:
  - apps/*
  - packages/*
allowBuilds:
  '@embedded-postgres/linux-x64': set this to true or false
  '@prisma/engines': set this to true or false
  esbuild: set this to true or false
  prisma: set this to true or false
onlyBuiltDependencies:
  - '@prisma/engines'
  - esbuild
  - embedded-postgres
